name: Blokko Android build

on:
  push:
    paths: ['blokko/**', 'app/**', '.github/workflows/blokko-android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run sync
      - name: Force Google test ads in this debug APK (never serve real ads to testers)
        run: |
          sed -i 's/testing: false/testing: true/' android/app/src/main/assets/public/config.js
          grep -q "testing: true" android/app/src/main/assets/public/config.js
      - name: Build debug APK (install on a phone to test)
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: blokko-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
