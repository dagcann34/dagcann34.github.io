<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="48%" r="55%">
      <stop offset="0%" stop-color="#2B354D"/>
      <stop offset="100%" stop-color="#1E2433"/>
    </radialGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7D6"/>
      <stop offset="45%" stop-color="#F2A541"/>
      <stop offset="100%" stop-color="#F2A541" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CE095"/>
      <stop offset="100%" stop-color="#4A9B53"/>
    </linearGradient>
    <linearGradient id="summerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE07D"/>
      <stop offset="100%" stop-color="#E09F3E"/>
    </linearGradient>
    <linearGradient id="autumnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2845C"/>
      <stop offset="100%" stop-color="#B84A27"/>
    </linearGradient>
    <linearGradient id="winterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90E0F3"/>
      <stop offset="100%" stop-color="#3D8FB5"/>
    </linearGradient>
    <linearGradient id="brushGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3D1"/>
      <stop offset="50%" stop-color="#F2A541"/>
      <stop offset="100%" stop-color="#C87619"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0D1018" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Rounded App Icon / Favicon Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#F4EFE6" stroke-opacity="0.14" stroke-width="4"/>

  <!-- Isometric Floating Diorama Base Shadow -->
  <polygon points="256,436 86,338 256,240 426,338" fill="#10141F" opacity="0.65"/>
  <!-- Diorama Earth Rim -->
  <polygon points="256,416 86,318 86,348 256,446 426,348 426,318" fill="#3A2E2B"/>
  <polygon points="256,416 256,446 426,348 426,318" fill="#2A201E"/>

  <!-- 4 Seasonal Isometric Quadrants -->
  <g filter="url(#softShadow)">
    <!-- Top Quadrant: Spring (Blossom Green) -->
    <polygon points="256,192 168,243 256,294 344,243" fill="url(#springGrad)"/>
    <!-- Right Quadrant: Summer (Warm Sun Gold) -->
    <polygon points="348,246 260,297 348,348 432,297" fill="url(#summerGrad)"/>
    <!-- Bottom Quadrant: Autumn (Terracotta Leaf) -->
    <polygon points="256,300 168,351 256,402 344,351" fill="url(#autumnGrad)"/>
    <!-- Left Quadrant: Winter (Crystalline Ice) -->
    <polygon points="164,246 80,297 164,348 252,297" fill="url(#winterGrad)"/>
  </g>

  <!-- Swirling Golden Brush Stroke Ring Embracing the Diorama -->
  <path d="M 112,262 C 92,158 190,82 292,98 C 392,114 442,208 400,298 C 378,344 330,368 290,364" 
        fill="none" stroke="url(#brushGold)" stroke-width="22" stroke-linecap="round" opacity="0.92"/>
  <!-- Brush Tip Flourish -->
  <path d="M 382,126 C 418,92 446,112 428,154 C 414,182 384,190 368,176 C 358,166 364,143 382,126 Z" 
        fill="#F2A541" filter="url(#softShadow)"/>
  <circle cx="436" cy="96" r="10" fill="#FFF7D6"/>
  <circle cx="104" cy="188" r="7" fill="#8CE095"/>
  <circle cx="144" cy="118" r="8" fill="#90E0F3"/>

  <!-- Central Glowing Amber Lantern (Ilgın's Beacon) -->
  <circle cx="256" cy="242" r="96" fill="url(#lanternGlow)"/>
  <g filter="url(#softShadow)">
    <!-- Lantern Handle -->
    <path d="M 232,162 A 24,24 0 0,1 280,162" fill="none" stroke="#F4EFE6" stroke-width="8" stroke-linecap="round"/>
    <!-- Lantern Roof / Hat (Ilgın motif) -->
    <polygon points="256,144 196,184 316,184" fill="#1E2433" stroke="#F2A541" stroke-width="5" stroke-linejoin="round"/>
    <!-- Lantern Glass Core -->
    <rect x="216" y="184" width="80" height="96" rx="18" fill="#FFF7D6" stroke="#1E2433" stroke-width="8"/>
    <rect x="228" y="196" width="56" height="72" rx="10" fill="#F2A541"/>
    <circle cx="256" cy="232" r="16" fill="#FFFDF5"/>
    <!-- Lantern Base -->
    <rect x="204" y="280" width="104" height="18" rx="9" fill="#1E2433" stroke="#F2A541" stroke-width="4"/>
  </g>
</svg>
